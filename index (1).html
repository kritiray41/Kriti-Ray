<title>kriti@iiit-manipur: ~</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#0b1020;--panel:rgba(11,16,32,.84);--fg:#d8e0ee;--dim:#7f8aa3;--acc:#f2b866;--ok:#7fd1b9;--err:#ff7b72;--bd:#27314b;--dot:#f2b866;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef1f6;--panel:rgba(255,255,255,.86);--fg:#1c2433;--dim:#5d6a82;--acc:#a95a00;--ok:#0f6e59;--err:#c42b2b;--bd:#c6cfdd;--dot:#a95a00}}
:root[data-theme="light"]{--bg:#eef1f6;--panel:rgba(255,255,255,.86);--fg:#1c2433;--dim:#5d6a82;--acc:#a95a00;--ok:#0f6e59;--err:#c42b2b;--bd:#c6cfdd;--dot:#a95a00}
:root[data-theme="dark"]{--bg:#0b1020;--panel:rgba(11,16,32,.84);--fg:#d8e0ee;--dim:#7f8aa3;--acc:#f2b866;--ok:#7fd1b9;--err:#ff7b72;--bd:#27314b;--dot:#f2b866}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{overflow:hidden;overscroll-behavior:none;height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1;box-sizing:border-box;height:100%;padding:12px;display:flex}
.term{margin:auto;width:100%;max-width:920px;height:100%;max-height:760px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--bd);border-radius:10px;backdrop-filter:blur(6px);overflow:hidden}
.bar{display:flex;justify-content:space-between;gap:12px;padding:8px 14px;border-bottom:1px solid var(--bd);color:var(--dim);font-size:12px}
#mood b{font-weight:600}
#out{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 14px}
.dots{display:flex;gap:6px;margin-right:12px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--dim);opacity:.5}.dots i:nth-child(1){background:var(--err);opacity:1}.dots i:nth-child(2){background:var(--acc);opacity:1}.dots i:nth-child(3){background:var(--ok);opacity:1}
.f label{display:block;margin:10px 0 4px;color:var(--dim);font-size:12px}.f input,.f textarea{width:100%;box-sizing:border-box;background:var(--panel);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:8px;font:inherit}.f textarea{min-height:120px}
.btn{display:inline-block;text-decoration:none;color:var(--bg);background:var(--acc);border-radius:6px;padding:6px 12px}
@media (max-width:700px){.chips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}.chips button{white-space:nowrap;padding:8px 13px;font-size:13px}#in{font-size:16px}main{padding:6px}}
.card2{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:flex-start;margin:6px 0}
.art{margin:0;font:9px/9px 'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;color:var(--acc);white-space:pre;overflow:hidden;flex:none}
.card2 .txt{flex:1;min-width:220px;white-space:pre-wrap;word-break:break-word}
.big{font-size:clamp(28px,7vw,46px);font-weight:600;line-height:1.15;color:var(--acc);margin:6px 0 2px}.chips button.hot{color:var(--bg);background:var(--acc);border-color:var(--acc)}
.l{white-space:pre-wrap;word-break:break-word;min-height:1.55em}
.cmd{color:var(--fg)}.dim{color:var(--dim)}.ok{color:var(--ok)}.err{color:var(--err)}.acc{color:var(--acc)}
a{color:var(--ok)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px 0}.chips button{background:none;color:var(--dim);border:1px solid var(--bd);padding:3px 9px;font-size:12px}.chips button:hover{color:var(--acc);border-color:var(--acc)}
.row{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--bd);align-items:center}
#ps{color:var(--acc);white-space:nowrap}
#in{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:inherit;caret-color:var(--acc)}
.row:focus-within{box-shadow:inset 0 0 0 1px var(--acc)}
#ov{position:fixed;inset:0;z-index:5;background:rgba(5,8,18,.72);display:none;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto}
#ov.on{display:block}
.card{max-width:860px;margin:0 auto;background:var(--bg);border:1px solid var(--acc);border-radius:10px;padding:18px 20px}
.card h2{margin:0 0 4px;font-size:18px;color:var(--acc)}
.card h3{margin:18px 0 6px;font-size:14px;color:var(--ok)}
.card p,.card li{margin:4px 0;color:var(--fg)}
.card ul{padding-left:18px;margin:4px 0}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.proj{border:1px solid var(--bd);border-radius:6px;padding:10px 12px}
.proj b{color:var(--acc)}
button{font:inherit;color:var(--bg);background:var(--acc);border:0;border-radius:6px;padding:6px 12px;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.hd{display:flex;justify-content:space-between;align-items:start;gap:12px}
.tbl{overflow-x:auto}
@media (max-width:560px){body{font-size:13px}}
</style>

/* ---------- In-browser frustration model ---------- */
/* Logistic scorer over live behaviour features. Runs fully client-side, zero network. */
const T={keys:[],errs:0,rep:0,pauses:0,last:'',tk:0,cool:0};
const W={b:-3.2,bs:5,err:.9,rep:.8,pause:.35};
function score(){
 const bs=T.keys.reduce((a,b)=>a+b,0),r=bs/Math.max(T.keys.length,8);
 const z=W.b+W.bs*r+W.err*T.errs+W.rep*T.rep+W.pause*Math.min(T.pauses,4);
 return 1/(1+Math.exp(-z));
}
function mood(submitted){
 const p=score(),lab=p>.8?'frustrated':p>.45?'uneasy':'calm';
 $('#mood').innerHTML=`signal: <b>${lab}</b> ${Math.round(p*100)}%`;
 if(p>.8&&Date.now()>T.cool&&(submitted||T.keys.length>12)){
  T.cool=Date.now()+60000;
  print('\n[system] System detects navigation difficulties. Launching graphical interface...','acc');
  Object.assign(T,{errs:0,rep:0,pauses:0,keys:[]});
  setTimeout(openGui,1400);
 }
}
function bad(line){T.errs++;T.rep=line===T.last?T.rep+1:0;T.last=line;T.tk=0}
function ok(){T.errs=0;T.rep=0;T.pauses=0;T.tk=0}
function track(e){
 if(e.key.length>1&&e.key!=='Backspace')return;
 const n=performance.now();if(T.tk&&n-T.tk>5000)T.pauses++;T.tk=n;
 T.keys.push(e.key==='Backspace'?1:0);if(T.keys.length>30)T.keys.shift();
 mood(false);
}

function rs(){const d=devicePixelRatio||1;w=cv.width=innerWidth*d;h=cv.height=innerHeight*d;col=getComputedStyle(document.documentElement).getPropertyValue('--dot').trim()}
function draw(){
 cx.clearRect(0,0,w,h);const R=Math.min(w,h)*.42,c=Math.cos(ang),s=Math.sin(ang);cx.fillStyle=col;
 for(const [x,y,z] of pts){const X=x*c+z*s,Z=-x*s+z*c,k=1/(1.9-Z*.5);
  cx.globalAlpha=.1+.28*(Z+1)/2;cx.beginPath();cx.arc(w/2+X*R*k*1.5,h/2+y*R*k*1.5,1.6*k*(devicePixelRatio||1),0,6.283);cx.fill()}
}
let mx=0;const cols=[];
function rain(){const f=16*(devicePixelRatio||1),n=Math.ceil(w/f);if(cols.length!==n){cols.length=0;for(let i=0;i<n;i++)cols.push(Math.random()*h/f)}
 cx.globalAlpha=1;cx.fillStyle='rgba(0,0,0,.14)';cx.fillRect(0,0,w,h);cx.fillStyle='#39ff7a';cx.font=f+'px monospace';
 cols.forEach((y,i)=>{cx.fillText(String.fromCharCode(0x30A0+Math.random()*96),i*f,y*f);cols[i]=y*f>h&&Math.random()>.975?0:y+1})}
function loop(){ang+=.0025;mx>Date.now()?rain():draw();requestAnimationFrame(loop)}
addEventListener('resize',rs);matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>setTimeout(rs,50));
rs();
if(matchMedia('(prefers-reduced-motion: reduce)').matches)draw();else loop();
